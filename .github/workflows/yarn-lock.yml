name: Yarn lock

# Renovate can bump Kotlin or an npm package a build script declares, but it can't run Gradle, so its branch keeps
# the old kotlin-js-store locks and every js build on it fails. This refreshes them on the branch.

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/build.gradle.kts'
      - gradle/libs.versions.toml
      - build-logic/**

concurrency:
  group: yarn-lock-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  refresh:
    name: "Refresh the yarn locks"
    if: github.actor == 'renovate[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: setup-java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Upgrade the locks
        run: ./gradlew kotlinUpgradeYarnLock kotlinWasmUpgradeYarnLock

      # A push made with the workflow token starts no workflow, so CI is dispatched on the branch by hand.
      - name: Commit, push and run CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain kotlin-js-store)" ]; then
            echo "The locks are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kotlin-js-store
          git commit -m "chore(deps): refresh the yarn locks"
          git push origin "HEAD:$HEAD_REF"
          gh workflow run ci.yml --ref "$HEAD_REF"
