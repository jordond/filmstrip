name: Snapshot

# Publishes the snapshot version in gradle.properties to the Maven Central snapshot repository once a night, when main
# has moved since the last snapshot and the fast lane passed on it. A release goes through publish.yml instead.

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

concurrency:
  group: snapshot
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  snapshot:
    name: Publish snapshot
    if: github.repository == 'jordond/filmstrip'
    runs-on: macos-latest
    # The modules upload one at a time, which is about 40 minutes of uploading on top of the build, and a run that
    # meets the repository's rate limit also sits out the waits below.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A scheduled run publishes only a commit no snapshot was published from yet. A commit the fast lane has not
      # passed on fails the run, so the next night tries it again instead of taking it as published.
      - name: Check that main has an unpublished, tested commit
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          sha=$(git rev-parse HEAD)
          runs="repos/$GITHUB_REPOSITORY/actions/workflows"
          published=$(gh api "$runs/snapshot.yml/runs?status=success&per_page=1" -q '.workflow_runs[0].head_sha')
          if [ "$EVENT" = schedule ] && [ "$published" = "$sha" ]; then
            echo "tested=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$sha already has a snapshot, nothing published"
            exit 0
          fi
          ci=$(gh api "$runs/ci.yml/runs?head_sha=$sha&event=push&per_page=1" -q '.workflow_runs[0].conclusion')
          if [ "$ci" != success ]; then
            echo "::error::the fast lane has not passed on $sha, it reads '$ci'"
            exit 1
          fi
          echo "tested=true" >> "$GITHUB_OUTPUT"

      - name: Read the version
        id: version
        if: steps.head.outputs.tested == 'true'
        run: |
          version=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          echo "name=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-SNAPSHOT) echo "snapshot=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "snapshot=false" >> "$GITHUB_OUTPUT"; echo "::notice::$version is not a snapshot, nothing published" ;;
          esac

      - name: Copy CI gradle.properties
        if: steps.version.outputs.snapshot == 'true'
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: setup-java
        if: steps.version.outputs.snapshot == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        if: steps.version.outputs.snapshot == 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Deploy ${{ steps.version.outputs.name }} to the snapshot repository
        if: steps.version.outputs.snapshot == 'true'
        # The snapshot repository answers 429 once a run has sent it enough requests, and every file of every target
        # is a request of its own. Gradle retries a 429 three times over three seconds by default, which is over
        # before the limit lifts, so a request here is retried eight times with waits doubling from 5 to 320 seconds.
        # The SHA-256 and SHA-512 checksums are left out, since the repository only asks for MD5 and SHA-1 and they
        # are two of every five requests.
        run: >-
          ./gradlew publishAllPublicationsToMavenCentral --no-configuration-cache --stacktrace
          -Dorg.gradle.internal.network.retry.max.attempts=8
          -Dorg.gradle.internal.network.retry.initial.backOff=5000
          -Dorg.gradle.internal.publish.checksums.insecure=true
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
