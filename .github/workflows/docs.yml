name: docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # renovate: datasource=npm depName=bun
  BUN_VERSION: "1.3.14"
  # renovate: datasource=npm depName=wrangler
  WRANGLER_VERSION: "4.158.0"

defaults:
  run:
    shell: bash
    working-directory: website

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 17
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build the API reference
        working-directory: .
        run: ./gradlew dokkaGenerate
      - name: Build the wasm sample
        working-directory: .
        run: ./gradlew :sample:demo:webApp:wasmJsBrowserDistribution :sample:tryIt:wasmJsBrowserDistribution :sample:playground:wasmJsBrowserDistribution
      - &node
        name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.node-version
      - &bun
        name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run check
      - name: Test
        run: bun test
      - name: Assemble
        env:
          FILMSTRIP_SITE_ENV: ${{ github.event_name == 'pull_request' && 'preview' || '' }}
        run: bun run assemble
      - name: Upload the site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: website/dist
          retention-days: 3

  deploy:
    name: Deploy to filmstrip.jordond.dev
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://filmstrip.jordond.dev
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    steps:
      - &checkout-config
        name: Check out the Wrangler config, worker and Node version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            website/.node-version
            website/wrangler.jsonc
            website/worker
            website/src/lib/hosts.ts
            .github/scripts
          sparse-checkout-cone-mode: false
      - &download
        name: Download the site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: website/dist
      - *node
      - *bun
      - name: Deploy the site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun x "wrangler@$WRANGLER_VERSION" deploy

  preview:
    name: Preview
    needs: check
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - *checkout-config
      - *download
      - *node
      - *bun
      - name: Upload a preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bun x "wrangler@$WRANGLER_VERSION" versions upload \
            --preview-alias "pr-$PR" \
            --tag "pr-$PR" \
            --message "PR #$PR @ ${SHA::7}"
          # Preview URLs are switched on by `wrangler deploy` (preview_urls in wrangler.jsonc),
          # so there are none before the first deploy from main.
          url=$(jq -r 'select(.type == "version-upload") | .preview_alias_url // empty' "$WRANGLER_OUTPUT_FILE_PATH")
          if [ -z "$url" ]; then
            echo "::warning::No preview URL from wrangler. Has filmstrip-docs been deployed from main yet?"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment the preview URL
        if: steps.upload.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.upload.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '**Docs preview:** %s\n\nBuilt from %s. Previews are noindex.\n' "$URL" "$SHA" > "$RUNNER_TEMP/comment.md"
          ../.github/scripts/sticky-comment.sh docs "$RUNNER_TEMP/comment.md"
      - name: Comment the failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '**Docs preview failed** for %s.\n\nLogs: %s\n\nThe preview URL, if any, still points at an older commit.\n' \
            "$SHA" "$RUN_URL" > "$RUNNER_TEMP/comment.md"
          ../.github/scripts/sticky-comment.sh docs "$RUNNER_TEMP/comment.md"
