name: docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # With a release tag, builds that release's version of the site and stores it on the release before deploying.
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release to build a version of the site for, like 0.1.0
        type: string
      source_ref:
        description: Ref to build that version from, when it is not the tag itself
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      source_ref:
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The asset on a GitHub release that holds its version of the site.
  SITE_ASSET: docs-site.tar.gz
  # A release run starts from the tag, and everything but that release's own version is built from main.
  SITE_REF: ${{ inputs.release_tag && 'main' || '' }}
  # renovate: datasource=npm depName=bun
  BUN_VERSION: "1.3.14"
  # renovate: datasource=npm depName=wrangler
  WRANGLER_VERSION: "4.158.0"

defaults:
  run:
    shell: bash
    working-directory: website

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SITE_REF }}
          persist-credentials: false
          fetch-depth: 0
      - &jdk
        name: Install JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 17
          distribution: temurin
      - &gradle
        name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - &api
        name: Build the API reference
        working-directory: .
        run: ./gradlew dokkaGenerate
      - &wasm
        name: Build the wasm sample
        working-directory: .
        run: ./gradlew :sample:demo:webApp:wasmJsBrowserDistribution :sample:tryIt:wasmJsBrowserDistribution :sample:playground:wasmJsBrowserDistribution
      - &node
        name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.node-version
      - &bun
        name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - &install
        name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run check
      - name: Test
        run: bun test
      - name: Assemble
        env:
          FILMSTRIP_SITE_ENV: ${{ github.event_name == 'pull_request' && 'preview' || '' }}
        run: bun run assemble
      - name: Upload the development version
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dev
          path: website/dist-version
          retention-days: 3

  version:
    name: Build the release's version
    if: inputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.release_tag }}
      # The version the docs quote and the API reference is titled with, the same override the publish uses.
      ORG_GRADLE_PROJECT_VERSION_NAME: ${{ inputs.release_tag }}
    steps:
      - name: Check out the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || inputs.release_tag }}
          persist-credentials: false
          fetch-depth: 0
      - *jdk
      - *gradle
      - *api
      - *wasm
      - *node
      - *bun
      - *install
      - name: Assemble
        run: |
          FILMSTRIP_DOCS_VERSION=$(bun scripts/version-label.ts "$TAG")
          export FILMSTRIP_DOCS_VERSION
          bun run assemble
          tar -czf "$RUNNER_TEMP/$SITE_ASSET" -C dist-version .
      - name: Store it on the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/$SITE_ASSET" --clobber

  assemble:
    name: Assemble every version
    needs: [check, version]
    if: ${{ !cancelled() && needs.check.result == 'success' && (needs.version.result == 'success' || needs.version.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the assemble script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SITE_REF }}
          persist-credentials: false
          sparse-checkout: |
            website/scripts
            website/src/lib/docsVersions.ts
          sparse-checkout-cone-mode: false
      - name: Download the development version
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dev
          path: website/dist-version
      - name: Download every release's version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p stored-versions
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq "
            .[] | select(.draft or .prerelease | not)
                | select(any(.assets[]; .name == \"$SITE_ASSET\")) | .tag_name" > "$RUNNER_TEMP/tags"
          while read -r tag; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$SITE_ASSET" --output "stored-versions/$tag.tar.gz"
          done < "$RUNNER_TEMP/tags"
      - *bun
      - name: Assemble
        env:
          FILMSTRIP_SITE_ENV: ${{ github.event_name == 'pull_request' && 'preview' || '' }}
        run: bun scripts/assemble-versions.ts stored-versions
      - name: Upload the site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: website/dist
          retention-days: 3

  deploy:
    name: Deploy to filmstrip.jordond.dev
    needs: assemble
    if: ${{ !cancelled() && needs.assemble.result == 'success' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || inputs.release_tag != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://filmstrip.jordond.dev
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    steps:
      - &checkout-config
        name: Check out the Wrangler config, worker and Node version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SITE_REF }}
          persist-credentials: false
          sparse-checkout: |
            website/.node-version
            website/wrangler.jsonc
            website/worker
            website/src/lib/hosts.ts
            website/src/lib/docsVersions.ts
            .github/scripts
          sparse-checkout-cone-mode: false
      - &download
        name: Download the site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: website/dist
      - *node
      - *bun
      - name: Deploy the site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun x "wrangler@$WRANGLER_VERSION" deploy

  preview:
    name: Preview
    needs: assemble
    if: ${{ !cancelled() && needs.assemble.result == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - *checkout-config
      - *download
      - *node
      - *bun
      - name: Upload a preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bun x "wrangler@$WRANGLER_VERSION" versions upload \
            --preview-alias "pr-$PR" \
            --tag "pr-$PR" \
            --message "PR #$PR @ ${SHA::7}"
          # Preview URLs are switched on by `wrangler deploy` (preview_urls in wrangler.jsonc),
          # so there are none before the first deploy from main.
          url=$(jq -r 'select(.type == "version-upload") | .preview_alias_url // empty' "$WRANGLER_OUTPUT_FILE_PATH")
          if [ -z "$url" ]; then
            echo "::warning::No preview URL from wrangler. Has filmstrip-docs been deployed from main yet?"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment the preview URL
        if: steps.upload.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.upload.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '**Docs preview:** %s/dev/\n\nBuilt from %s as the development version. Previews are noindex.\n' \
            "$URL" "$SHA" > "$RUNNER_TEMP/comment.md"
          ../.github/scripts/sticky-comment.sh docs "$RUNNER_TEMP/comment.md"
      - name: Comment the failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '**Docs preview failed** for %s.\n\nLogs: %s\n\nThe preview URL, if any, still points at an older commit.\n' \
            "$SHA" "$RUN_URL" > "$RUNNER_TEMP/comment.md"
          ../.github/scripts/sticky-comment.sh docs "$RUNNER_TEMP/comment.md"
