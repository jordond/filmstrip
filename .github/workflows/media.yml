name: Media

# The media lane. Every Gradle call passes -Pmedia, which brings the *MediaTest classes back. *HardwareTest classes
# stay out, since the hosted macOS GPU is a paravirtual device whose encoder jitters, so Apple pixel and encode suites
# count only on real hardware in the local lane. Runs nightly on main, on dispatch, and from publish.yml before a
# release goes out.
#
# Job budget. GitHub runs at most 20 jobs at once, five of them macOS, and a job past that waits for a free slot, so
# the lane's wall time is its slowest job only while it stays inside both. It holds 20.
#
#   macOS  4   ios 3, macos 1
#   Linux 16   ffmpeg 8 in 5 and ffmpeg 9 in 3, browser 4, android device 4
#
# A new cell or shard has to come out of this budget. Shard counts follow gradle/test-weights.txt, written from a run
# of this lane, so a shard's share of a cell's weight is close to its hosted time.

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: media-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # A month-end BtbN autobuild, which BtbN keeps once the dailies roll off. The gpl build is static apart from glibc
  # and carries libx265, so it passes checkFfmpegTestToolchain's ten-bit HEVC gate.
  FFMPEG9_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-31-12-59/ffmpeg-n9.0.2-39-g7adfbe40dc-linux64-gpl-9.0.tar.xz
  FFMPEG9_SHA256: 73e29a56974ae5a651133a04584c7483b21afe941e17dc91d79814a758b608d3

jobs:
  # ffmpeg 8 is apt's 8.0.1 on ubuntu 26.04, the backend's floor, and runs every jvm suite. ffmpeg 9 is the pinned
  # static build on the PATH and runs the suites that drive ffmpeg. ffmpeg 8 runs in five shards and ffmpeg 9 in three,
  # since one runner takes close to an hour on 8 and half an hour on 9.
  #
  # A cell with a shard passes -PtestShard=i/n, which packs each test task's classes by gradle/test-weights.txt so every
  # class runs in exactly one shard of the cell. -PtestWeights=ffmpeg-<major> packs by that major's own times, across
  # every module the call runs at once, so no shard takes each module's heaviest class.
  ffmpeg:
    name: "Test ffmpeg ${{ matrix.major }} ${{ matrix.shard }}"
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    # Each job's matrix values in its own name for its artifacts, which the Name the artifacts step makes safe.
    env:
      CELL: ffmpeg-${{ matrix.major }}-${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { major: 8, shard: 1/5, tasks: "jvmTest" }
          - { major: 8, shard: 2/5, tasks: "jvmTest" }
          - { major: 8, shard: 3/5, tasks: "jvmTest" }
          - { major: 8, shard: 4/5, tasks: "jvmTest" }
          - { major: 8, shard: 5/5, tasks: "jvmTest" }
          - { major: 9, shard: 1/3, tasks: ":filmstrip-transform-ffmpeg:jvmTest :filmstrip-player:jvmTest :filmstrip-effects:jvmTest :filmstrip-effects-filters:jvmTest" }
          - { major: 9, shard: 2/3, tasks: ":filmstrip-transform-ffmpeg:jvmTest :filmstrip-player:jvmTest :filmstrip-effects:jvmTest :filmstrip-effects-filters:jvmTest" }
          - { major: 9, shard: 3/3, tasks: ":filmstrip-transform-ffmpeg:jvmTest :filmstrip-player:jvmTest :filmstrip-effects:jvmTest :filmstrip-effects-filters:jvmTest" }
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@v7

      - &java
        name: setup-java
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      # The JVM draws a text overlay with the fonts fontconfig finds, so the cell pins one it always has.
      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fontconfig fonts-dejavu-core

      - name: Install ffmpeg 8
        if: matrix.major == 8
        run: sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install ffmpeg 9
        if: matrix.major == 9
        run: |
          dir="$RUNNER_TEMP/ffmpeg9"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/ffmpeg.tar.xz" "$FFMPEG9_URL"
          echo "$FFMPEG9_SHA256  $dir/ffmpeg.tar.xz" | sha256sum -c -
          tar -xJf "$dir/ffmpeg.tar.xz" -C "$dir" --strip-components=1
          echo "$dir/bin" >> "$GITHUB_PATH"

      # Checks the cell got the major it means to test. Whether a build meets the backend's floor is
      # checkFfmpegTestToolchain's call, which every ffmpeg jvmTest runs first with the backend's own rule.
      - name: Check ffmpeg major
        env:
          INTENDED_MAJOR: ${{ matrix.major }}
        run: |
          banner=$(ffmpeg -version | head -1)
          echo "$banner"
          major=$(echo "$banner" | sed -nE 's/^ffmpeg version n?([0-9]+)\..*/\1/p')
          if [ "$major" != "$INTENDED_MAJOR" ]; then
            echo "::error::expected a release of ffmpeg $INTENDED_MAJOR, got '$banner'"
            exit 1
          fi

      - &gradle
        name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Run tests
        run: >-
          ./gradlew ${{ matrix.tasks }} -Pmedia --scan -PtestShard=${{ matrix.shard }}
          -PtestWeights=ffmpeg-${{ matrix.major }}

      - &slowest
        name: Slowest test classes
        if: always()
        run: python3 .github/scripts/slowest-tests.py

      # An artifact name can hold no slash or space, so the shard's i/n and any spaces become dashes.
      - &artifact
        name: Name the artifacts
        if: always()
        run: echo "ARTIFACT=$(echo "$CELL" | tr -s '/ ' '-' | sed 's/-*$//')" >> "$GITHUB_ENV"

      # Every job keeps its result XML, green or red, so slowest-tests.py --weights can rebuild the shard weights from
      # one run's artifacts.
      - &results
        name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: media-results-${{ env.ARTIFACT }}
          path: |
            **/build/test-results/
            **/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7

      - &reports
        name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: media-reports-${{ env.ARTIFACT }}
          path: |
            **/build/reports/tests/
            **/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 7

  # See ci.yml for why the browser cells run with smaller daemon heaps. js also runs every pureTest class, which the
  # fast lane runs on jvm only.
  #
  # The webcodecs and player modules share a cell per target in two shards packed by gradle/test-weights.txt, from the
  # class times the shared Karma config writes. The other web modules each finish in under a minute, so they run whole
  # after the wasm shards, one target in each.
  #
  # Each entry of calls, split on semicolons, is its own Gradle call, so a shard runs one module's SwiftShader Chrome at
  # a time and every call runs even when one before it fails. A call names its own shard, so the rest call that follows
  # a shard runs every class.
  browser:
    name: "Test ${{ matrix.target }} browser ${{ matrix.modules }} ${{ matrix.shard }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CELL: browser-${{ matrix.target }}-${{ matrix.modules }}-${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: js, modules: webcodecs and player, shard: 1/2, calls: ":filmstrip-player:jsBrowserTest -PpureEverywhere -PtestShard=1/2;:filmstrip-transform-webcodecs:jsBrowserTest -PpureEverywhere -PtestShard=1/2" }
          - { target: js, modules: webcodecs and player, shard: 2/2, calls: ":filmstrip-player:jsBrowserTest -PpureEverywhere -PtestShard=2/2;:filmstrip-transform-webcodecs:jsBrowserTest -PpureEverywhere -PtestShard=2/2" }
          - { target: wasm, modules: webcodecs and player then js rest, shard: 1/2, calls: ":filmstrip-player:wasmJsBrowserTest -PtestShard=1/2;:filmstrip-transform-webcodecs:wasmJsBrowserTest -PtestShard=1/2;jsBrowserTest -x :filmstrip-transform-webcodecs:jsBrowserTest -x :filmstrip-player:jsBrowserTest -PpureEverywhere" }
          - { target: wasm, modules: webcodecs and player then wasm rest, shard: 2/2, calls: ":filmstrip-player:wasmJsBrowserTest -PtestShard=2/2;:filmstrip-transform-webcodecs:wasmJsBrowserTest -PtestShard=2/2;wasmJsBrowserTest -x :filmstrip-transform-webcodecs:wasmJsBrowserTest -x :filmstrip-player:wasmJsBrowserTest" }
    steps:
      - *checkout
      - *java
      - *gradle
      - name: Run browser tests
        env:
          CALLS: ${{ matrix.calls }}
        run: |
          status=0
          IFS=';' read -ra calls <<< "$CALLS"
          for call in "${calls[@]}"; do
            read -ra args <<< "$call"
            ./gradlew "${args[@]}" -Pmedia --scan \
              "-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options=-Xmx3g" || status=1
          done
          exit "$status"
      - *slowest
      - *artifact
      - *results
      - *reports

  # The shard reaches the device run as a notClass runner argument, so each shard skips the classes the other owns.
  device:
    name: "Test android device ${{ matrix.suite }} ${{ matrix.shard }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CELL: device-${{ matrix.suite }}-${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: media3, shard: 1/2, tasks: ":filmstrip-transform-media3:connectedAndroidDeviceTest", apks: ":filmstrip-transform-media3:packageAndroidDeviceTest" }
          - { suite: media3, shard: 2/2, tasks: ":filmstrip-transform-media3:connectedAndroidDeviceTest", apks: ":filmstrip-transform-media3:packageAndroidDeviceTest" }
          - { suite: rest, shard: 1/2, tasks: "connectedAndroidDeviceTest -x :filmstrip-transform-media3:connectedAndroidDeviceTest", apks: "packageAndroidDeviceTest -x :filmstrip-transform-media3:packageAndroidDeviceTest" }
          - { suite: rest, shard: 2/2, tasks: "connectedAndroidDeviceTest -x :filmstrip-transform-media3:connectedAndroidDeviceTest", apks: "packageAndroidDeviceTest -x :filmstrip-transform-media3:packageAndroidDeviceTest" }
    steps:
      - *checkout
      - *java

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - *gradle

      # Builds the test APKs in the background while the emulator runner installs and boots its device. The runner
      # runs each script line in its own shell, so await-apks.sh waits for the build and replays its log before the
      # tests start in the same daemon.
      - name: Build device test APKs in the background
        run: |
          (./gradlew ${{ matrix.apks }} -PtestShard=${{ matrix.shard }} -Pmedia; echo $? > "$RUNNER_TEMP/apks.status") < /dev/null > "$RUNNER_TEMP/apks.log" 2>&1 &
          cat > "$RUNNER_TEMP/await-apks.sh" <<'EOF'
          until [ -f "$RUNNER_TEMP/apks.status" ]; do sleep 5; done
          cat "$RUNNER_TEMP/apks.log"
          exit "$(cat "$RUNNER_TEMP/apks.status")"
          EOF

      - name: Run device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          # The runner's defaults with two changes.
          # -HardwareDecoder leaves video to the software decoder. The API 30 image's host-backed
          # OMX.android.goldfish.h264.decoder drops frames it was told to render, and media3 waits
          # 20s for them on an emulator at every seek and release.
          # swangle_indirect renders through ANGLE on SwiftShader's Vulkan device. The legacy
          # SwiftShader GLES behind swiftshader_indirect spends 10 to 18s of one host core on the
          # first draw of each blurred fill shader, which runs an export past media3's 25s wait for
          # its first muxer sample.
          emulator-options: "-no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim -feature -HardwareDecoder"
          script: |
            bash "$RUNNER_TEMP/await-apks.sh"
            ./gradlew ${{ matrix.tasks }} -PtestShard=${{ matrix.shard }} -Pmedia --scan

      - *slowest
      - *artifact
      - *results
      - *reports

  # The simulator runs only what no other target can, under the iOS-only rule. Shared commonTest and appleTest classes
  # run once, on macos below, apart from the canary classes TestShards.kt names. The modules are grouped into four jobs,
  # since GitHub runs at most five macOS jobs at once and each job pays its setup and klib compile again. The player
  # group compiles the avfoundation klib on its way to the player's, so the two share a job.
  # A module with no iOS-only and no canary class would only link here, so it is left out. check-ios-matrix.sh fails
  # CI when the groups and the modules printIosTestModules prints under that rule differ.
  ios:
    name: "Test ios ${{ matrix.group }}"
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CELL: ios-${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: compose, modules: "filmstrip-compose" }
          - { group: core, modules: "filmstrip-io-filekit filmstrip-core filmstrip-effects" }
          - { group: player, modules: "filmstrip-transform-avfoundation filmstrip-player" }
    steps:
      - *checkout
      - *java
      - &konan
        name: Cache Konan
        uses: actions/cache@v6
        with:
          path: |
            ~/.konan/caches
            ~/.konan/dependencies
            ~/.konan/kotlin-native-prebuilt-*
          key: ${{ runner.os }}-konan-${{ hashFiles('**/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-
      - *gradle

      # The boot is the first task of the same parallel build, so it runs in its own worker while the klibs compile
      # and the test binaries link. A fresh iOS runtime keeps the machine busy with first boot work for minutes after
      # it reports booted, and that work lands under the link instead of under the first tests.
      - name: Run ios simulator tests
        env:
          MODULES: ${{ matrix.modules }}
        run: |
          tasks=()
          for module in $MODULES; do tasks+=(":$module:iosSimulatorArm64Test"); done
          ./gradlew :filmstrip-player:bootIosSimulator "${tasks[@]}" -Pmedia --scan
      - *slowest
      - *artifact
      - *results
      - *reports

  # Runs every pureTest class on macOS as well, which the fast lane runs on jvm only.
  macos:
    name: "Test macos"
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CELL: macos
    steps:
      - *checkout
      - *java
      - *konan
      - *gradle
      - name: Run macos tests
        run: ./gradlew macosArm64Test -Pmedia -PpureEverywhere --scan
      - *slowest
      - *artifact
      - *results
      - *reports
