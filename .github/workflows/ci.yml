name: CI

# The fast lane. Media classes (*MediaTest) and hardware classes (*HardwareTest) are left out by build-logic, and
# pureTest classes run on each plugin's reference target only. media.yml runs the rest nightly and before a release.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths-ignore:
      - '**.md'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # A pull request runs the library jobs when a library file or this workflow changed, and only the sample job when
  # nothing but the sample changed. A push to main or a dispatch runs every library job.
  changes:
    name: "Changes"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      library: ${{ steps.classify.outputs.library }}
      sample: ${{ steps.classify.outputs.sample }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Classify changed paths
        id: classify
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD | .github/scripts/classify-paths.sh | tee -a "$GITHUB_OUTPUT"
          else
            printf 'library=true\nsample=true\n' | tee -a "$GITHUB_OUTPUT"
          fi

  verify:
    name: "Verify"
    needs: changes
    if: needs.changes.outputs.library == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@v7

      - &java
        name: setup-java
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - &konan
        name: Cache Konan
        uses: actions/cache@v6
        with:
          path: |
            ~/.konan/caches
            ~/.konan/dependencies
            ~/.konan/kotlin-native-prebuilt-*
          key: ${{ runner.os }}-konan-${{ hashFiles('**/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - &gradle
        name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Gradle Wrapper Validation
        uses: gradle/actions/wrapper-validation@v6

      - name: Path classifier
        run: bash .github/scripts/classify-paths-test.sh

      - name: iOS matrix lists every module with iOS tests
        run: bash .github/scripts/check-ios-matrix.sh

      # Klibs cross-compile on Linux, so the ABI dumps of the Apple targets check here too.
      - name: Formatting, ABI, architecture guards and the docs snippets
        run: >-
          ./gradlew --continue --scan
          spotlessCheck checkKotlinAbi checkForbiddenImports checkLayering checkKDocWidth
          :internal:docs-samples:compileKotlinJvm
          :internal:docs-samples:compileKotlinWasmJs
          :internal:docs-samples:compileAndroidMain
          :internal:docs-samples:compileKotlinIosArm64
          :sample:tryIt:compileKotlinWasmJs

      - name: Build logic tests
        run: ./gradlew -p build-logic :convention:test

  lint:
    name: "Lint"
    needs: changes
    if: needs.changes.outputs.library == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - *checkout
      - *java
      - *gradle
      - name: Lint
        run: ./gradlew lint --scan

  jvm:
    name: "Test jvm"
    needs: changes
    if: needs.changes.outputs.library == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CELL: jvm
    steps:
      - *checkout
      - *java
      # apt's ffmpeg on 26.04 is 8.0.1, the backend's floor. Every ffmpeg jvmTest runs checkFfmpegTestToolchain first.
      # The JVM draws a text overlay with the fonts fontconfig finds, so the cell pins one it always has.
      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fontconfig fonts-dejavu-core
      - *gradle
      - name: Run jvm tests
        run: ./gradlew jvmTest --scan
      - &slowest
        name: Slowest test classes
        if: always()
        run: python3 .github/scripts/slowest-tests.py
      # An artifact name can hold no slash or space, so any in the cell's name become dashes.
      - &artifact
        name: Name the artifacts
        if: failure()
        run: echo "ARTIFACT=$(echo "$CELL" | tr -s '/ ' '-' | sed 's/-*$//')" >> "$GITHUB_ENV"
      - &reports
        name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ env.ARTIFACT }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

  android:
    name: "Test android"
    needs: changes
    if: needs.changes.outputs.library == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CELL: android
    steps:
      - *checkout
      - *java
      - *gradle
      - name: Run android host tests and build the sample
        run: ./gradlew testAndroidHostTest :sample:demo:androidApp:assembleDebug --scan
      - *slowest
      - *artifact
      - *reports

  # A browser cell runs a SwiftShader Chrome per module, about 8 GB between them at their peak, beside the daemons.
  # At gradle.properties' 8 GB heaps the Kotlin daemon alone reaches 9.5 GB, and in 16 GB the kernel kills Chrome
  # mid-suite. With these heaps the same cell, measured in a 16 GB container, kills nothing.
  js:
    name: "Test js"
    needs: changes
    if: needs.changes.outputs.library == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CELL: js
    steps:
      - *checkout
      - *java
      - *gradle
      - name: Run js browser tests
        run: >-
          ./gradlew jsBrowserTest --scan
          "-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options=-Xmx3g"
      - *slowest
      - *artifact
      - *reports

  # Compiles the test sources no fast-lane job runs: the iOS test klibs, the wasm test executable and the Android
  # device tests.
  compile:
    name: "Compile tests"
    needs: changes
    if: needs.changes.outputs.library == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - *checkout
      - *java
      - *konan
      - *gradle
      - name: Compile every test source
        run: ./gradlew compileTests --scan

  # The only fast-lane job on macOS, and the only place Kotlin/Native logic and the Apple smoke export run per push.
  macos:
    name: "Test macos"
    needs: changes
    if: needs.changes.outputs.library == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CELL: macos
    steps:
      - *checkout
      - *java
      - *konan
      - *gradle
      - name: Run macos tests
        run: ./gradlew macosArm64Test --scan
      - *slowest
      - *artifact
      - *reports

  # A pull request that touches only the sample, or the stylesheets it reads, builds the app and runs its jvm tests.
  sample:
    name: "Test sample"
    needs: changes
    if: needs.changes.outputs.library != 'true' && needs.changes.outputs.sample == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CELL: sample
    steps:
      - *checkout
      - *java
      - *gradle
      - name: Build the sample and run its jvm tests
        run: >-
          ./gradlew --scan
          :sample:demo:androidApp:assembleDebug
          :sample:common:jvmTest
          :sample:demo:shared:jvmTest
          :sample:tryIt:jvmTest
          :sample:tryIt:compileKotlinWasmJs
      - *slowest
      - *artifact
      - *reports
