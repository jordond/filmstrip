# Gradle
org.gradle.jvmargs=-Xmx8192M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx8192M"
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.tooling.parallel=true

# Kotlin
kotlin.code.style=official
kotlin.native.binary.gc=cms

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# MPP
kotlin.mpp.stability.nowarn=true
kotlin.mpp.enableCInteropCommonization=true

# Publishing. Coordinates, POM and signing live in build-logic/Publishing.kt. Only the version is
# here, and a release overrides it with ORG_GRADLE_PROJECT_VERSION_NAME from the git tag.
VERSION_NAME=0.1.0-SNAPSHOT

# Swift Export is on by default as of Kotlin 2.4 and there is no property to turn it off, but nothing
# here runs it: it is not in the build graph and CI no longer checks it. filmstrip publishes klibs
# and its consumers are Kotlin.
